<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ title }} for FoodieExpress.">
  <title>{{ title }} — FoodieExpress</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v='1') }}">
</head>
<body>
  <header class="site-header">
    <nav class="nav shell" aria-label="Main navigation">
      <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">f<span>.</span></span><span>foodie<span class="brand-light">express</span></span></a>
      <a class="button button-small" href="{{ url_for('home') }}">Back to FoodieExpress <span>↗</span></a>
    </nav>
  </header>
  <main class="legal-page shell">
    <div class="eyebrow">GOOD FOOD, GOOD TO KNOW</div>
    <h1>{{ title }}</h1>
    <p class="legal-intro">FoodieExpress mini-project · Last updated November 2026</p>
    {% for heading, content in sections %}
      <section>
        <h2>{{ heading }}</h2>
        <p>{{ content }}</p>
      </section>
    {% endfor %}
    <a class="text-link" href="{{ url_for('home') }}">← Back to the storefront</a>
  </main>
  <footer class="footer legal-footer"><div class="shell footer-bottom"><span>© 2026 FoodieExpress. Made for good days.</span><a href="mailto:hello@foodieexpress.example">Contact us</a></div></footer>
</body>
</html>
